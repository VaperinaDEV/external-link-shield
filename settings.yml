internal_domains:
  type: list
  default: ""
  description: "Your forum and CDN domains (e.g., example.com|example-cdn.com). These will have NO icon and NO modal."
  
excluded_domains:
  type: list
  default: ""
  description: "Trusted external domains (e.g., youtube.com|google.com). These will show a LOCK icon but skip the modal/shielding."
  
enable_anonymous_blocking:
  type: bool
  default: true
  description: "Replace external links for anonymous users with a login prompt."

anonymous_redirect_url:
  type: string
  default: "/login"
  description: "URL where anonymous users are redirected when trying to access external links. Leave empty to disable redirection."

enable_tl0_blocking:
  type: bool
  default: true
  description: "Replace external links for TL0 users with a trust-level information link."

tl0_redirect_url:
  type: string
  default: ""
  description: "URL where TL0 users are redirected when click the link. Leave empty to disable redirection."

enable_tl1_manual_reveal:
  type: bool
  default: true
  description: "Require TL1 users to manually reveal external links."

enable_exit_confirmation:
  type: bool
  default: true
  description: "Show an exit confirmation modal when users click external links."

exit_confirmation_continue_icon:
  default: "arrow-up-right-from-square"
  type: icon
  description: "The icon shown in the exit confirmation modal continue button."

external_link_icon:
  default: "arrow-up-right-from-square"
  type: icon
  description: "The icon shown next to unknown external links."

external_link_icon_color:
  type: string
  default: ""
  description: "Color for the external link icon (e.g. #999999 or var(--primary-medium)). Leave empty to match the surrounding text color."

trusted_link_icon:
  default: "lock"
  type: icon
  description: "The icon shown next to trusted/excluded domain links."

trusted_link_icon_color:
  type: string
  default: "var(--success)"
  description: "Color for the trusted link icon (e.g. #999999 or var(--primary-medium)). Leave empty to match the surrounding text color."

link_icon_position:
  type: enum
  default: "before"
  choices:
    - "before"
    - "after"
  description: "Whether the icon appears before or after the link text."

svg_icons:
  default: "arrow-up-right-from-square|arrow-down"
  type: list
  list_type: "compact"
  description: "List of FontAwesome 6 icons used in this theme component."
